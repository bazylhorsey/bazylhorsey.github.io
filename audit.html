<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>layout audit</title>
    <style>
      html, body { margin: 0; background: #111; color: #ddd; }
      body { font: 13px/1.5 ui-monospace, Menlo, monospace; padding: 16px; }
      iframe { border: 0; display: block; }
      h1 { font-size: 15px; margin: 0 0 12px; color: #8f8; }
      .bad { color: #f66; }
      .good { color: #6f6; }
      pre { white-space: pre-wrap; margin: 0 0 16px; }
      iframe { position: absolute; left: -20000px; }
    </style>
  </head>
  <body>
    <h1>layout audit: serving build/, so the iframe finds it</h1>
    <pre id="out">running...</pre>

    <script>
      // Catches the class of bug where a grid child lands in the wrong column
      // and text collapses into a one-word-per-line ribbon, plus anything that
      // overflows the viewport horizontally. Both are invisible on a narrow
      // window, so check the widths that actually get served.
      //
      //   python3 -m http.server -d build 8080
      //   open http://127.0.0.1:8080/audit.html   (needs audit.html in build/)
      var WIDTHS = [375, 768, 1280, 1600, 1920, 2560];

      function audit(width, done) {
        var f = document.createElement("iframe");
        f.style.cssText =
          "width:" + width + "px;height:9000px;position:absolute;left:-20000px";
        f.src = "index.html";
        f.addEventListener("load", function () {
          var d = f.contentDocument;
          setTimeout(function () {
            var lines = [];
            var ribbons = 0;
            var overflows = 0;
            var all = d.querySelectorAll(".page *");

            for (var i = 0; i < all.length; i++) {
              var el = all[i];
              var text = (el.textContent || "").trim();
              var r = el.getBoundingClientRect();

              if (text.length > 70 && r.width > 0 && r.width < 170) {
                ribbons++;
                lines.push(
                  "  ribbon   <" + el.tagName.toLowerCase() +
                    ' class="' + (el.className || "") + '"> w=' +
                    Math.round(r.width) + " h=" + Math.round(r.height) +
                    " :: " + text.slice(0, 50).replace(/\s+/g, " ")
                );
              }

              if (r.width > 0 && (r.right > width + 1 || r.left < -1)) {
                overflows++;
                lines.push(
                  "  overflow <" + el.tagName.toLowerCase() +
                    ' class="' + (el.className || "") + '"> left=' +
                    Math.round(r.left) + " right=" + Math.round(r.right)
                );
              }
            }

            var docOverflow = d.documentElement.scrollWidth > width;
            lines.unshift(
              (ribbons || overflows || docOverflow ? "FAIL" : "ok  ") +
                "  " + String(width).padEnd(5) +
                " scrollWidth=" + d.documentElement.scrollWidth +
                " ribbons=" + ribbons +
                " overflow=" + overflows +
                (docOverflow ? " (document scrolls horizontally)" : "")
            );
            done(lines);
          }, 500);
        });
        document.body.appendChild(f);
      }

      var out = [];
      var i = 0;
      (function next() {
        if (i >= WIDTHS.length) {
          var failed = out.filter(function (l) {
            return l.indexOf("FAIL") === 0;
          }).length;
          document.getElementById("out").textContent =
            out.join("\n") +
            "\n\n" +
            (failed
              ? failed + " width(s) failed"
              : "all widths clean");
          document.querySelector("h1").textContent = failed
            ? failed + " width(s) failed"
            : "all widths clean";
          return;
        }
        audit(WIDTHS[i++], function (lines) {
          out = out.concat(lines);
          next();
        });
      })();
    </script>
  </body>
</html>
